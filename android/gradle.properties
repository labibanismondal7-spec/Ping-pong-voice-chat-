org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true

# --- Termux / on-device ARM64 build support -------------------------------
# AGP downloads a Linux x86_64 ELF aapt2 binary from Maven and tries to exec
# it directly. On Termux (Android/aarch64) that binary cannot run, and the
# shell falls back to interpreting the ELF bytes as a shell script, which is
# where the "Syntax error: '(' unexpected" comes from. Once aapt2 fails like
# this, resource compilation/linking is broken too, which is what produces
# the downstream "No package ID 7f found for resource ID 0x..." errors -
# those are a *symptom*, not a separate bug, so they are not fixed by
# touching any 0x7f IDs.
#
# PRODUCTION-READINESS FIX (2026-08-25): this override used to be hardcoded
# here unconditionally, which broke every build environment that ISN'T
# Termux — GitHub Actions, a normal Linux/Mac/Windows dev machine, etc. all
# have no /data/data/com.termux path, so AGP would fail to find any aapt2 at
# all on those machines (a hard build failure, not a fallback). The fix
# stays Termux-only now: build-termux.sh (next to this file) auto-detects
# Termux and passes -Pandroid.aapt2FromMavenOverride=... on the command
# line for that one environment, so this checked-in file no longer forces
# a Termux-only path onto every other machine/CI runner that builds this
# project. See BUILD_TERMUX.md and .github/workflows/android-release.yml.
